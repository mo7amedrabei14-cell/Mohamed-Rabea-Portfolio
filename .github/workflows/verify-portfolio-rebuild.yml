name: Verify portfolio experience rebuild

on:
  push:
    branches:
      - feature/portfolio-experience-rebuild-2026-10-17

permissions:
  contents: read

concurrency:
  group: portfolio-rebuild-check
  cancel-in-progress: true

jobs:
  build:
    name: Production build (no deployment)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Build production site
        run: npm run build

      - name: Verify Vite output
        shell: bash
        run: |
          test -s dist/index.html
          test -n "$(find dist/assets -maxdepth 1 -type f -name '*.js' -print -quit)"
          test -n "$(find dist/assets -maxdepth 1 -type f -name '*.css' -print -quit)"
          grep -q 'assets/' dist/index.html
          if grep -q '/src/main.jsx' dist/index.html; then
            echo "Production index still references the React source entrypoint." >&2
            exit 1
          fi
          echo "Production bundle structure verified. This workflow does not deploy."

      - name: Install Playwright runner
        run: npm install --no-save --package-lock=false playwright

      - name: Install Chromium and operating system libraries
        run: npx playwright install --with-deps chromium

      - name: Start production preview server
        shell: bash
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/portfolio-preview.log 2>&1 &
          echo $! > /tmp/portfolio-preview.pid
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:4173/Mohamed-Rabea-Portfolio/ > /dev/null; then
              echo "Production preview is ready."
              exit 0
            fi
            sleep 1
          done
          cat /tmp/portfolio-preview.log
          exit 1

      - name: Capture and inspect responsive visual previews
        env:
          VISUAL_BASE_URL: http://127.0.0.1:4173/Mohamed-Rabea-Portfolio/
        run: node scripts/visual-qa.mjs

      - name: Publish preview report in the job summary
        if: always()
        shell: bash
        run: |
          if test -f visual-artifacts/summary.md; then
            cat visual-artifacts/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
          if test -f /tmp/portfolio-preview.log; then
            printf '\n## Preview server log\n' >> "$GITHUB_STEP_SUMMARY"
            tail -n 35 /tmp/portfolio-preview.log >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload screenshots and layout measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-visual-preview
          path: visual-artifacts/
          if-no-files-found: warn
          retention-days: 7
