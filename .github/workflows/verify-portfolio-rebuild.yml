name: Verify portfolio experience rebuild

on:
  push:
    branches:
      - feature/portfolio-experience-rebuild-2026-10-17

permissions:
  contents: read

concurrency:
  group: portfolio-rebuild-check
  cancel-in-progress: true

jobs:
  build:
    name: Production build (no deployment)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Build production site
        run: npm run build

      - name: Verify Vite output
        shell: bash
        run: |
          test -s dist/index.html
          test -n "$(find dist/assets -maxdepth 1 -type f -name '*.js' -print -quit)"
          test -n "$(find dist/assets -maxdepth 1 -type f -name '*.css' -print -quit)"
          grep -q 'assets/' dist/index.html
          if grep -q '/src/main.jsx' dist/index.html; then
            echo "Production index still references the React source entrypoint." >&2
            exit 1
          fi
          echo "Production bundle structure verified. This workflow does not deploy."
